name: Feedback or idea
description: Tell us how Yogurt worked for you, or suggest an improvement
labels: [feedback]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What worked well, what was confusing, what you'd like to see.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language you used the app in
      options:
        - English
        - Português
